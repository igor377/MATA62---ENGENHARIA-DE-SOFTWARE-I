spring.application.name=Veridt
spring.config.import=optional:file:.env[.properties]
spring.modulith.detection-strategy=explicitly-annotated
spring.docker.compose.start.arguments=postgres,mailpit,seaweedfs

spring.datasource.url=jdbc:postgresql://localhost:5433/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

management.endpoints.web.exposure.include=health
management.health.mail.enabled=false

spring.modulith.events.republish-outstanding-events-on-restart=true
veridt.mail.from=${MAIL_FROM:no-reply@veridt.local}
veridt.mail.threads=${MAIL_THREADS:2}
# Intervalo da limpeza de e-mails sensíveis já enviados (ISO-8601).
veridt.mail.sensitive-cleanup-interval=${MAIL_SENSITIVE_CLEANUP_INTERVAL:PT5M}

# As tabelas do Spring Session vêm da migration V1.
spring.session.jdbc.initialize-schema=never

veridt.identity.reset-token-validity=${RESET_TOKEN_VALIDITY:15m}
veridt.identity.reset-url=${RESET_URL:http://localhost:8080/redefinir-senha}
veridt.identity.password-min-length=${PASSWORD_MIN_LENGTH:8}
veridt.identity.confirmation-url=${CONFIRMATION_URL:http://localhost:3000/confirmar-email}
veridt.identity.confirmation-token-validity=${CONFIRMATION_TOKEN_VALIDITY:24h}
veridt.identity.confirmation-resend-interval=${CONFIRMATION_RESEND_INTERVAL:60s}
veridt.identity.unconfirmed-account-retention=${UNCONFIRMED_ACCOUNT_RETENTION:7d}
# Frequência da limpeza das contas não confirmadas (ISO-8601).
veridt.identity.unconfirmed-cleanup-interval=${UNCONFIRMED_CLEANUP_INTERVAL:PT1H}

# Pagamentos: só o provedor falso existe até o CRE-04. A simulação aprova o próprio pedido sem provedor e nunca pode
# ser ligada em produção.
veridt.payment.provider=${PAYMENT_PROVIDER:fake}
veridt.payment.simulation-enabled=${PAYMENT_SIMULATION_ENABLED:false}
veridt.payment.fake-return-url=${PAYMENT_FAKE_RETURN_URL:http://localhost:3000/creditos/pagamento}

# Mantém o executor padrão do Spring mesmo com o executor exclusivo da notificação registrado.
spring.task.execution.mode=force

# Armazenamento de arquivos pela API S3 (SeaweedFS em desenvolvimento).
veridt.storage.s3.endpoint=${S3_ENDPOINT:http://localhost:8333}
veridt.storage.s3.region=${S3_REGION:us-east-1}
veridt.storage.s3.access-key=${S3_ACCESS_KEY:veridt}
veridt.storage.s3.secret-key=${S3_SECRET_KEY:veridt-dev-secret}
veridt.storage.s3.bucket=${S3_BUCKET:veridt-arquivos}
